<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fondo Negro -->
  <rect width="100" height="100" fill="#000000" rx="15" />

  <!-- Círculos exteriores -->
  <circle cx="50" cy="50" r="45" stroke="#FFFFFF" fill="none" stroke-width="1.5" />
  <circle cx="50" cy="50" r="41" stroke="#FFFFFF" fill="none" stroke-width="2" />

  <!-- Máscara para que los silos y el suelo no se salgan del círculo interior -->
  <clipPath id="innerCircle">
    <circle cx="50" cy="50" r="40" />
  </clipPath>

  <g clip-path="url(#innerCircle)">
    <!-- Silo Izquierdo (El más alto) -->
    <path d="M18 85 V35 Q29 30 40 35 V85" stroke="#FFFFFF" fill="none" stroke-width="2" />
    
    <!-- Silo Central -->
    <path d="M40 85 V45 Q51 40 62 45 V85" stroke="#FFFFFF" fill="none" stroke-width="2" />
    
    <!-- Silo Derecho (El más bajo) -->
    <path d="M62 85 V55 Q71 50 80 55 V85" stroke="#FFFFFF" fill="none" stroke-width="2" />

    <!-- Curva del Suelo -->
    <path d="M0 80 Q50 72 100 80 V100 H0 Z" fill="#000000" stroke="#FFFFFF" stroke-width="2" />

    <!-- Estructura superior del silo izquierdo -->
    <rect x="27.5" y="24" width="3" height="10" fill="#FFFFFF" />

    <!-- Ventanas Silo Izquierdo -->
    <rect x="23" y="45" width="4" height="8" fill="#FFFFFF" />
    <rect x="31" y="45" width="4" height="8" fill="#FFFFFF" />

    <!-- Ventanas Silo Central -->
    <rect x="45" y="55" width="4" height="8" fill="#FFFFFF" />
    <rect x="53" y="55" width="4" height="8" fill="#FFFFFF" />

    <!-- Ventanas Silo Derecho -->
    <rect x="65" y="63" width="4" height="8" fill="#FFFFFF" />
    <rect x="73" y="63" width="4" height="8" fill="#FFFFFF" />
  </g>
</svg>
